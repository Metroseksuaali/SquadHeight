; SquadHeightRuntimeCpp configuration.
; Values are reloaded every time a new F8 scan starts.
; Distances here are meters. Unreal uses centimeters internally.

[Scan]
; 4.0 is recommended for a first test; 1.0 is the final high-resolution default
; retained from the supplied Lua config.
resolution_m = 1.0
trace_top_m = 5000.0
trace_bottom_m = -5000.0

; ETraceTypeQuery numeric value. 0 = TraceTypeQuery1, normally Visibility.
trace_type_query = 0
trace_complex = true
fallback_simple_trace = true

; topmost | terrain_under_overhang
surface_mode = topmost
overhang_min_clearance_m = 2.5
retrace_epsilon_m = 0.05
max_hits_per_column = 16

; 0 disables normal filtering. Example: 0.5 keeps mostly upward-facing surfaces.
walkable_min_normal_z = 0.0

; Per EngineTick game-thread budget. Processing stops when either limit is hit.
max_cells_per_tick = 100000
frame_budget_ms = 45.0

[Output]
; Relative paths are resolved against the game's current working directory.
output_root = SquadHeight_output
output_name =
keep_raw = true
write_full_json = true
; 0 disables fixed-size JSON output; otherwise >= 2.
downsample_to = 500

[Orientation]
transpose = false
flip_rows = false
flip_cols = false
grid_rotation_deg = 0.0

[ManualMap]
; Leave blank to use automatic detection from the built-in map table.
; To override, set all five values.
name =
min_x =
max_x =
min_y =
max_y =

[Filters]
; Comma-separated values. Empty value disables that list.
exclude_actor_classes = InstancedFoliageActor
exclude_actor_base_classes = /Script/Engine.Pawn, /Script/Squad.SQVehicle, /Script/Squad.SQDeployable
exclude_actor_class_prefixes = BP_POI_Reference
exclude_component_classes = FoliageInstancedStaticMeshComponent, LandscapeGrassComponent

pcg_vegetation_actor_name_prefixes = PCGStamp_
pcg_vegetation_require_actor_prefix = false
pcg_vegetation_component_name_bases = ISM_SM_Birch_Large02, ISM_SM_Birchcluster_01, ISM_SM_BirchLarge03, ISM_SM_GrassRiverCluster_medl01, ISM_SM_GrassRiverCluster_medl02, ISM_SM_Oakshrub01, ISM_SM_Oakshrub02, ISM_SM_Reeds02, ISM_SM_Reeds03, ISM_SM_Reeds04, ISM_SM_Reeds05, ISM_SM_scotspine_large01, ISM_SM_Scotspine_mid01, ISM_SM_Scotspine_small01

volume_shape_component_classes = BoxComponent, SphereComponent, CapsuleComponent, BrushComponent
exclude_asset_path_keywords = foliage, surroundmesh
volume_actor_name_keywords = volume, boundary, waterblock
